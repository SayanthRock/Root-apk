name: Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission to gradlew
        run: chmod +x apps/sayanth-wallpaper/gradlew
        continue-on-error: true

      - name: Build APK
        run: |
          cd apps/sayanth-wallpaper
          ./gradlew assembleRelease
        continue-on-error: true

      - name: Build with Gradle (fallback)
        if: failure()
        run: |
          cd apps/sayanth-wallpaper
          gradle assembleRelease

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v3
        with:
          name: sayanth-wallpaper-apk
          path: apps/sayanth-wallpaper/app/build/outputs/apk/release/*.apk
        continue-on-error: true

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: apps/sayanth-wallpaper/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
