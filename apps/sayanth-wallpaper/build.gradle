plugins {
    id 'com.android.application'
}

android {
    // Better to define the namespace here for AGP 7.0+
    namespace 'com.sayanthrock.wallpaper' 
    compileSdk 33

    defaultConfig {
        applicationId "com.sayanthrock.wallpaper"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0-beta" // Matching your Global Beta announcement

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            // Suggest turning this to 'true' later to shrink your APK size
            minifyEnabled false 
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Updated versions for better stability and UI features
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0' 
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Recommended: Glide or Coil for loading those HD Wallpapers efficiently
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'
}
